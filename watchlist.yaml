settings:
  report_timezone: Asia/Taipei
  news:
    lookback_days: 3
    max_articles_per_ticker: 8
    provider: google_news_rss
  x_signals:
    mode: manual
    manual_file: data/x_posts.yaml
  valuation:
    provider: yfinance
  earnings:
    provider_order:
      - yfinance
  macro:
    enabled: true
    days_back: 1
    days_ahead: 14
  notifications:
    telegram:
      enabled: false
      disable_web_page_preview: true

tickers:
  - symbol: NVDA
    company_name: NVIDIA Corporation
    aliases:
      - Nvidia
      - NVIDIA
    keywords:
      - GPU
      - AI chips
      - data center
    research:
      thesis_state: active
      thesis_trigger: execution
      thesis_text: "NVDA thesis: data-center AI demand and CUDA ecosystem keep execution quality central; watch margins, supply, and hyperscaler capex durability."
    trusted_news_domains:
      - reuters.com
      - cnbc.com
      - wsj.com
      - ft.com
      - bloomberg.com
    trusted_x_accounts:
      - handle: example_analyst
        category: industry_expert
        display_name: Example Analyst


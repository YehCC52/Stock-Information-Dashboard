settings:
  report_timezone: Asia/Taipei
  news:
    lookback_days: 3
    max_articles_per_ticker: 8
    provider: google_news_rss
  x_signals:
    mode: manual
    manual_file: data/x_posts.yaml
  valuation:
    provider: yfinance
  earnings:
    provider_order:
      - yfinance
  macro:
    enabled: true
    days_back: 1
    days_ahead: 14
    manual_events:
      - name: Example CPI Release
        category: inflation
        event_datetime: "2026-05-12T20:30:00+08:00"
        source: manual
        source_url: ""
        notes: Add CPI, Treasury auctions, Fed speeches, or company-specific macro events here.
  notifications:
    telegram:
      enabled: false
      disable_web_page_preview: true

tickers:
  - symbol: NVDA
    company_name: NVIDIA Corporation
    aliases:
      - Nvidia
      - NVIDIA
    keywords:
      - GPU
      - AI chips
      - data center
    position:
      status: holding
      shares: 10
      avg_cost: 120.00
      portfolio_weight: 6.5
      position_size: 1200
    # Optional trading playbook. These are baseline defaults: edits made in the
    # dashboard override them per-field and round-trip to SQLite via
    # --export-research-state / --import-research-state.
    plan:
      bull_case: AI capex still rising into 2026
      bear_case: Margin compression if Blackwell yield slips
      entry_plan: Add on 20MA pullback, only if RSI < 65
      add_zone: 20MA retest, >= 1.5x average volume
      reduce_zone: RSI > 80 with volume divergence
      stop_loss: Daily close below 50MA
    trusted_news_domains:
      - reuters.com
      - cnbc.com
      - wsj.com
      - ft.com
      - bloomberg.com
    trusted_x_accounts:
      - handle: example_analyst
        category: industry_expert
        display_name: Example Analyst

  - symbol: MSFT
    company_name: Microsoft Corporation
    aliases:
      - Microsoft
    keywords:
      - Azure
      - Copilot
      - OpenAI
    position:
      status: watchlist
    trusted_news_domains:
      - reuters.com
      - cnbc.com
      - wsj.com
      - ft.com
      - bloomberg.com
    trusted_x_accounts: []
